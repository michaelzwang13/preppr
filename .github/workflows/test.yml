name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hacknyu25_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TESTING: "true"
      FLASK_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: hacknyu25_test
      DB_NAME_TEST: hacknyu25_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load database schema
        run: |
          for f in create.sql triggers.sql tips_schema.sql promotional_codes_migration.sql; do
            sed 's/^USE hacknyu25;/USE hacknyu25_test;/' "src/database/$f" \
              | mysql -h 127.0.0.1 -uroot -proot hacknyu25_test
          done

      - name: Run tests
        run: python -m pytest --cov=src --cov-report=term
